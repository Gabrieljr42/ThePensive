name: Verify Pensieve
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pensieve_test
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: integration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pensieve -d pensieve_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PENSIEVE_TEST_DATABASE_URL: postgresql://pensieve:integration_test@127.0.0.1:5432/pensieve_test
      PENSIEVE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests backend/migrations
      - run: pytest -q
        working-directory: backend
      - run: python scripts/export_contracts.py
      - run: git diff --exit-code contracts/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node tests/inquiry-unit.mjs
      - run: npm run build
