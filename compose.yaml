name: pensieve
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pensieve}
      POSTGRES_USER: ${POSTGRES_USER:-pensieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pensieve_local}
    volumes:
      - archive-db:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-archive.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    volumes:
      - ./data/private:/data/private
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pensieve}:${POSTGRES_PASSWORD:-pensieve_local}@db:5432/${POSTGRES_DB:-pensieve}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PENSIEVE_LIVE_ENABLED: ${PENSIEVE_LIVE_ENABLED:-false}
      PENSIEVE_PUBLIC_MODE: ${PENSIEVE_PUBLIC_MODE:-false}
      PENSIEVE_PROXY_KEY: ${PENSIEVE_PROXY_KEY:-}
      PENSIEVE_SESSION_SECRET: ${PENSIEVE_SESSION_SECRET:-}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pensieve}:${POSTGRES_PASSWORD:-pensieve_local}@db:5432/${POSTGRES_DB:-pensieve}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PENSIEVE_LIVE_ENABLED: ${PENSIEVE_LIVE_ENABLED:-false}
      PENSIEVE_PUBLIC_MODE: ${PENSIEVE_PUBLIC_MODE:-false}
      PENSIEVE_PROXY_KEY: ${PENSIEVE_PROXY_KEY:-}
      PENSIEVE_SESSION_SECRET: ${PENSIEVE_SESSION_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      PENSIEVE_PROXY_KEY: ${PENSIEVE_PROXY_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  archive-db:
