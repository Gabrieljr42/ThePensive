name: pensieve
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pensieve}
      POSTGRES_USER: ${POSTGRES_USER:-pensieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pensieve_local}
    volumes:
      - archive-db:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-archive.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pensieve}:${POSTGRES_PASSWORD:-pensieve_local}@db:5432/${POSTGRES_DB:-pensieve}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  archive-db:

