<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estudo da penseira</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d4c4ae'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1018;
        overflow: hidden;
        color: #e7dcc8;
        font-family: "Palatino Linotype", Palatino, serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        display: none;
        max-width: 38rem;
        margin: 12vh auto;
        padding: 0 1.5rem;
        line-height: 1.5;
      }
      code {
        font-family: Consolas, monospace;
        font-size: 0.95em;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <p id="boot"></p>
    <script>
      if (location.protocol === "file:") {
        const boot = document.getElementById("boot");
        boot.style.display = "block";
        boot.innerHTML =
          "Esta cena usa módulos e o three já instalado no frontend. Na pasta <code>frontend</code>, rode <code>npx --yes serve -l 4173 .</code> e abra <code>http://127.0.0.1:4173/realistic-study/</code>.";
      }
    </script>
    <script type="module">
      if (location.protocol !== "file:") {
        import("./scene.mjs").catch((error) => {
          const boot = document.getElementById("boot");
          boot.style.display = "block";
          boot.textContent = error && error.message ? error.message : String(error);
        });
      }
    </script>
  </body>
</html>
